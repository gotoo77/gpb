[project]
name = "gphotos-backup"
version = "0.1.0"
description = "Reliable local Google Photos archive CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "google-auth>=2.40",
  "google-auth-oauthlib>=1.2",
  "httpx>=0.28",
  "pydantic>=2.10",
  "rich>=13.9",
  "typer>=0.15",
]

[project.scripts]
gpb = "gphotos_backup.cli:app"
gphotos-backup = "gphotos_backup.cli:app"

[dependency-groups]
dev = ["mypy>=1.15", "pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gphotos_backup"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
